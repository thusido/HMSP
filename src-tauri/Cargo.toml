[package]
name = "hmsp"
version = "0.1.0"
description = "HMSubtitlePlayer - Audiobook-style subtitle reader"
edition = "2021"

[lib]
name = "hmsp_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "hmsp"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = ["config-json5"] }

[dependencies]
tauri = { version = "2", features = ["config-json5", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-android-fs = "=29.0.0"

[profile.release]
lto = true
opt-level = "z"
panic = "abort"
codegen-units = 1
