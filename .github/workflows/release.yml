name: 'release'

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  pwa:
    # iPadOS distribution source (separate from desktop/mobile installers).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm build:pwa

      - uses: actions/upload-artifact@v4
        with:
          name: pwa-dist
          path: dist/

  desktop:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target aarch64-apple-darwin'
          - platform: 'windows-latest'
            args: ''
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: pnpm install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: 'HMSP v__VERSION__'
          releaseBody: |
            무서명 테스트 빌드입니다. 처음 설치할 때 OS별 안내를 참고하세요.

            ## macOS (.dmg)
            1. 앱을 Applications에 복사 후 **우클릭 → 열기**로 실행하세요.
            2. 그래도 "손상되어 열 수 없음"이 뜨면 터미널에서 quarantine 해제
               (직접 빌드한 테스트용 앱에만 사용하세요):
               `xattr -dr com.apple.quarantine /Applications/HMSubtitlePlayer.app`

            ## Windows (-setup.exe / .msi)
            SmartScreen "알 수 없는 게시자" 경고 시 **추가 정보 → 그래도 실행**을 누르세요.

            ## Android (arm64 APK)
            알 수 없는 출처의 앱 설치를 허용한 뒤 설치하세요. arm64(신형 기기 표준)용입니다.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: false
          args: ${{ matrix.args }}

  android:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - name: setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: setup Android SDK
        uses: android-actions/setup-android@v3

      - name: install NDK + build tools
        run: |
          yes | sdkmanager --licenses > /dev/null
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0" "ndk;28.2.13676358"

      - name: install Rust stable + Android targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - run: pnpm install --frozen-lockfile

      - name: android init + release build (per-ABI)
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/28.2.13676358
        run: |
          pnpm tauri android init
          pnpm tauri android build --split-per-abi

      - name: sign APKs + AABs with release keystore
        env:
          ANDROID_KEYSTORE: ${{ secrets.ANDROID_KEYSTORE }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          echo "$ANDROID_KEYSTORE" | base64 -d > /tmp/HMSP-release.keystore
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          for apk in src-tauri/gen/android/app/build/outputs/apk/*/release/app-*-release-unsigned.apk; do
            out="${apk/-unsigned/-signed}"
            "$APKSIGNER" sign --ks /tmp/HMSP-release.keystore --ks-pass pass:"$ANDROID_KEYSTORE_PASSWORD" --out "$out" "$apk"
            "$APKSIGNER" verify "$out"
          done
          for aab in src-tauri/gen/android/app/build/outputs/bundle/*Release/app-*-release.aab; do
            jarsigner -keystore /tmp/HMSP-release.keystore -storepass "$ANDROID_KEYSTORE_PASSWORD" "$aab" "$ANDROID_KEY_ALIAS"
            jarsigner -verify "$aab"
          done
          rm /tmp/HMSP-release.keystore

      - name: attach Android assets to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          draft: true
          files: |
            src-tauri/gen/android/app/build/outputs/apk/*/release/app-*-release-signed.apk
            src-tauri/gen/android/app/build/outputs/bundle/*Release/app-*-release.aab
