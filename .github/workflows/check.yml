name: 'check'

# Lightweight gate for PRs and main pushes. Release pipelines are separate.
on:
  pull_request:
    branches: ['main']
  push:
    branches: ['main']

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc -b
      - run: pnpm test
      - run: pnpm build
